<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频下载</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; padding: 44px 52px; border-radius: 18px; box-shadow: 0 6px 24px rgba(30, 64, 120, .10); text-align: center; max-width: 480px; width: 90%; }
  h1 { font-size: 22px; color: #1f2937; margin: 0 0 18px; }
  p.tip { color: #4b5563; font-size: 15px; line-height: 1.6; margin: 0 0 30px; }
  .btn { display: inline-block; background: #2b7de9; color: #fff; border: none; cursor: pointer; padding: 13px 36px; border-radius: 9px; font-size: 16px; font-family: inherit; transition: background .2s; }
  .btn:hover { background: #1e5fb8; }
  .count { color: #9ca3af; font-size: 13px; margin-top: 20px; }
  .file { color: #9ca3af; font-size: 12px; margin-top: 10px; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <h1>视频下载</h1>
  <p class="tip">若30秒内未自动下载，请点击下方下载按钮</p>
  <button class="btn" id="btn">点击下载</button>
  <div class="count" id="count"></div>
  <div class="file">微信视频2026-11-04_195444_580.mp4（1.7MB）</div>
</div>
<script>
  var VIDEO_URL = 'https://raw.githubusercontent.com/wkejdjrjrre111/video-download/main/%E5%BE%AE%E4%BF%A1%E8%A7%86%E9%A2%912026-11-04_195444_580.mp4';
  var FILENAME = '微信视频2026-11-04_195444_580.mp4';
  var started = false;
  var remain = 30;
  var countEl = document.getElementById('count');

  function startDownload() {
    if (started) return;
    started = true;
    countEl.textContent = '正在获取文件…';
    fetch(VIDEO_URL)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .then(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = FILENAME;
        document.body.appendChild(a);
        a.click();
        setTimeout(function() { URL.revokeObjectURL(url); }, 10000);
        countEl.textContent = '已开始下载';
      })
      .catch(function(e) {
        countEl.textContent = '下载失败（' + e.message + '），请点击按钮重试';
        started = false;
      });
  }

  function tick() {
    if (remain <= 0) { countEl.textContent = '未检测到下载，请点击下方按钮手动下载'; return; }
    countEl.textContent = '等待自动下载… ' + remain + ' 秒';
    remain--;
    setTimeout(tick, 1000);
  }

  document.getElementById('btn').addEventListener('click', startDownload);

  window.addEventListener('load', function() {
    tick();
    setTimeout(startDownload, 600);
  });
</script>
</body>
</html>
